name: CI Tests & Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Pytest & Quality Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Test Suite with Pytest & Coverage
      run: |
        pytest tests/ -v --cov=gene_language --cov-report=xml --cov-report=term-missing

    - name: Run CLI Sanity Check
      run: |
        python -m gene_language.cli.main --help
        python -m gene_language.cli.main analyze data/sample_promoters.fasta --json-out
